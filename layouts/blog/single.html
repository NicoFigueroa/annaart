{{ define "main" }}
<section class="section">
  <div class="container post">
    <div class="detail-header">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <h1 class="page-title">{{ .Title }}</h1>
    </div>
    <div class="content">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
